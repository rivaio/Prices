name: Update prices
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency: update-prices
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cryptography
      - run: python update.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALLOWED_IDS: ${{ secrets.ALLOWED_IDS }}
          PASS_IZONE: ${{ secrets.PASS_IZONE }}
          PASS_ESPACE: ${{ secrets.PASS_ESPACE }}
      - name: Commit changes
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add index.html espace.html
          git diff --cached --quiet || (git commit -m "update prices" && git push)
