let LANG="ku";try{LANG=localStorage.getItem("lang")==="en"?"en":"ku"}catch(e){}
function T(k){return I18N[LANG][k]}
function applyLang(){const h=document.documentElement;h.lang=LANG;h.dir=LANG==="ku"?"rtl":"ltr";document.querySelectorAll("[data-i]").forEach(e=>{e.textContent=T(e.dataset.i)});document.querySelectorAll("[data-ip]").forEach(e=>{e.placeholder=T(e.dataset.ip)});document.querySelectorAll("#langsw button").forEach(b=>b.classList.toggle("on",b.dataset.l===LANG));if(window.__refresh)window.__refresh()}
document.querySelectorAll("#langsw button").forEach(b=>b.addEventListener("click",()=>{LANG=b.dataset.l;try{localStorage.setItem("lang",LANG)}catch(e){}applyLang()}));
applyLang();
const PLAIN=``;
function start(RAW){
const DATA=RAW.split("\n").filter(Boolean).map((line,i)=>{const [model,storage,color,price,code,...extra]=line.split("|");return {id:i,model,storage,color,price:Number(price),code,note:extra.join("|")};});
const $=id=>document.getElementById(id);
const MODELS=[...new Set(DATA.map(x=>x.model))];
MODELS.forEach(m=>{const o=document.createElement("option");o.value=m;o.textContent=m;$('modelSelect').appendChild(o)});
function simType(code){if(code==="ALL"||code==="JA-LLA"||code.toUpperCase()==="ESIM"||code==="AC"||code==="NO")return "esim";if(code==="CH")return "dual";if(code.endsWith("A"))return "active";if(code.endsWith("N"))return "inactive";return "other"}
function badgeClass(code){const t=simType(code);return t==="active"?"active":t==="inactive"?"inactive":t==="esim"?"esim":t==="dual"?"dual":""}
function label(code){if(code.toUpperCase()==="ESIM")return "eSIM";const t=simType(code);if(t==="esim")return code+" · eSIM";if(t==="dual")return code+" · 2 SIM";if(t==="active")return code+" · 1 SIM · Active";if(t==="inactive")return code+" · 1 SIM · Not Active";return code}
function colorEmoji(c){return ({Black:"⚫",Gold:"🟡",White:"⚪","Sky Blue":"🔵","Mist Blue":"🔵",Sage:"🟢",Lavender:"🟣",Orange:"🟠",Silver:"⚪",Blue:"🔵",Burgundy:"🔴",Glacier:"🔵","Star White":"⚪","Night Sky":"🌌"})[c]||"📱"}
function fillSelect(el,values,firstLabel){el.innerHTML="";const all=document.createElement("option");all.value="";all.textContent=firstLabel;el.appendChild(all);values.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;el.appendChild(o)});}
function updateOptions(){const m=$('modelSelect').value;const rows=DATA.filter(x=>!m||x.model===m);const storages=[...new Set(rows.map(x=>x.storage))].sort((a,b)=>parseFloat(a)-parseFloat(b));const storage=$('storage').value;fillSelect($('storage'),storages,T("allStorage"));if(storages.includes(storage))$('storage').value=storage;const st=$('storage').value;const narrowed=rows.filter(x=>!st||x.storage===st);const colors=[...new Set(narrowed.map(x=>x.color))];const oldColor=$('colorSelect').value;fillSelect($('colorSelect'),colors,T("allColors"));if(colors.includes(oldColor))$('colorSelect').value=oldColor;$('storage').disabled=!m;$('sim').disabled=!m;$('colorSelect').disabled=!m;}
function render(){const m=$('modelSelect').value,s=$('sim').value,st=$('storage').value,c=$('colorSelect').value;let list=DATA.filter(x=>(!m||x.model===m)&&(!s||simType(x.code)===s)&&(!st||x.storage===st)&&(!c||x.color===c));$('total').textContent=DATA.length;$('shown').textContent=list.length;$('count').textContent=list.length+" "+T("results");if(!m){$('results').innerHTML='<div class="empty">'+T("pickModel")+'</div>';return}const groups=new Map();for(const x of list){const k=x.model+"|"+x.storage;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)}if(!list.length){$('results').innerHTML='<div class="empty">'+T("noPrice")+'<br><small>'+T("noPriceSub")+'</small></div>';return}$('results').innerHTML=[...groups.values()].map(items=>{const first=items[0];return `<section class="group"><div class="group-title"><span class="model">${first.model}</span><span class="storage">${first.storage}</span></div>${items.map(x=>`<div class="item"><div class="color">${colorEmoji(x.color)} ${x.color}${x.note?`<span class="note">${x.note}</span>`:""}</div><span class="code ${badgeClass(x.code)}">${label(x.code)}</span><span class="price ${x.price===0?"na":""}">${x.price===0?T("na"):"$"+x.price.toLocaleString("en-US")}</span></div>`).join("")}</section>`}).join("");}
$('modelSelect').addEventListener('change',()=>{$('storage').value="";$('sim').value="";updateOptions();render()});$('storage').addEventListener('change',()=>{const prev=$('colorSelect').value;updateOptions();$('colorSelect').value=prev;render()});$('sim').addEventListener('change',render);$('colorSelect').addEventListener('change',render);$('reset').addEventListener('click',()=>{$('modelSelect').value="";$('sim').value="";updateOptions();render()});$('total').textContent=DATA.length;window.__refresh=()=>{updateOptions();render()};updateOptions();render();
}
(function(){
const lock=document.getElementById("lock");
if(!ENC){lock.remove();document.body.classList.remove("locked");start(PLAIN);return}
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(ENC.s),iterations:ENC.i,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(ENC.v)},key,b(ENC.c)))}
async function tryPw(pw,remember){try{const raw=await dec(pw);if(remember){try{localStorage.setItem("pw",pw)}catch(e){}}lock.remove();document.body.classList.remove("locked");start(raw);return true}catch(e){return false}}
const f=document.getElementById("lockForm"),inp=document.getElementById("lockPw"),err=document.getElementById("lockErr");
f.addEventListener("submit",async e=>{e.preventDefault();err.textContent="";const ok=await tryPw(inp.value,true);if(!ok){err.textContent=T("wrong");inp.value="";inp.focus()}});
let saved=null;try{saved=localStorage.getItem("pw")}catch(e){}
if(saved)tryPw(saved,false).then(ok=>{if(!ok){try{localStorage.removeItem("pw")}catch(e){}}});
})();
</script></body></html>
